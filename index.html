<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spasecor</title>
    <meta name="application-name" content="Spasecor" />
    <meta name="apple-mobile-web-app-title" content="Spasecor" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#664EAE" />
    <meta
      name="description"
      content="Spasecor is the incident management platform for space and satellite cybersecurity teams."
    />
    <meta property="og:title" content="Spasecor" />
    <meta
      property="og:description"
      content="Track, investigate and resolve cyber incidents across satellites, ground stations and mission infrastructure."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script>
      // Prevent theme flash: apply saved/system theme before hydration.
      (function () {
        try {
          var t = localStorage.getItem("spasecor-theme");
          if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
